<!DOCTYPE html>
{% load static %}
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Создать профиль</title>

    <link rel="stylesheet" href="{% static 'tasks/profile_create.css' %}">
</head>

<body>

<div class="profile-create-container">

    <h1>Создать профиль</h1>

    <form method="post" class="profile-form">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="create-button">
            Создать профиль
        </button>
    </form>

    <a href="{% url 'task-list' %}" class="back-button">
        Назад к задачам
    </a>

</div>

</body>
</html>
